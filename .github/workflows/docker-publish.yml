name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, e.g. 0.2.0 (optional; adds 0.2.0 and 0.2)
        required: false
        type: string

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    # Single-arch, so a build of this app should take single-digit minutes.
    # Anything approaching this cap means something is wrong, so fail loudly
    # rather than burning an hour of runner time.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ghcr.io rejects any uppercase character in the repository path, so
      # lowercase ${{ github.repository }} before it is used as an image name.
      - name: Compute lowercase image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A push event derives its tags from the ref, which is why a tag push
      # publishes 0.2.0 and 0.2. `auto-increment.yml` cannot push a tag that
      # triggers this workflow — a push made with GITHUB_TOKEN starts no runs at
      # all — so it dispatches this workflow instead, and a dispatch has no
      # version-bearing ref to read. Derive the two semver tags from the input so
      # a dispatched run publishes the same tags a tag push would.
      - name: Derive the semver tags from the dispatched version
        id: semver
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${RAW_VERSION#v}"
          IFS=. read -r MAJOR MINOR _REST <<< "$VERSION"
          echo "exact=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "minor=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.semver.outputs.exact }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
            type=raw,value=${{ steps.semver.outputs.minor }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
          labels: |
            org.opencontainers.image.title=typesafe-openai-proxy
            org.opencontainers.image.description=OpenAI-compatible proxy that gives hass_local_openai_llm a typed, calibrated fast path: one decision call per command instead of an LLM turn.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          # linux/arm64 is a one-line change here (add it to the platforms list
          # and re-add docker/setup-qemu-action) if a Raspberry Pi is ever in
          # scope. It is not today: the build is amd64-only on purpose.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Same version, baked as a LABEL inside the image, so `docker inspect`
          # can name the build without the dashboard.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
