<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Dashboard for the Typesafe routing proxy: a calibrated fast path in front of hass_local_openai_llm." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22%230a0f1c%22%2F%3E%3Cpath%20d%3D%22M8%2021l6-10%204%207%203-4%203%207%22%20stroke%3D%22%235eead4%22%20stroke-width%3D%222.5%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E" />
    <title>Typesafe routing proxy</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
        background: #0a0f1c;
      }
      body {
        -webkit-font-smoothing: antialiased;
      }
      #boot-error {
        display: none;
        margin: 24px;
        padding: 16px 18px;
        border: 1px solid #f87171;
        border-radius: 12px;
        background: #1b1116;
        color: #ffe4e6;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #boot-error strong {
        display: block;
        margin-bottom: 8px;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-error" role="alert"></div>
    <noscript>This dashboard needs JavaScript. The OpenAI-compatible API at /v1/chat/completions works without it.</noscript>
    <script>
      // React blanks the page if it dies before mounting, and a dashboard that silently disappears
      // tells you nothing. Surface the reason instead, whatever stage failed.
      (function () {
        var box = document.getElementById('boot-error');
        function show(label, detail) {
          if (!box || box.dataset.shown === 'true') return;
          box.dataset.shown = 'true';
          box.innerHTML = '<strong>' + label + '</strong>';
          box.appendChild(document.createTextNode(detail));
          box.style.display = 'block';
        }
        window.addEventListener('error', function (event) {
          var target = event.target;
          if (target && target !== window && (target.src || target.href)) {
            show('A file failed to load', String(target.src || target.href));
            return;
          }
          show('The dashboard failed to start', (event.error && event.error.stack) || event.message || 'unknown error');
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          show('The dashboard hit an unhandled error', (reason && (reason.stack || reason.message)) || String(reason));
        });
        // app.js is a classic module script: if it never executed, say so rather than showing nothing.
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount === 0) {
            show('The dashboard did not start', 'app.js did not run. Run "npm run build:ui" (or npm run dev) and reload.');
          }
        }, 4000);
      })();
    </script>
    <script src="app.js" type="module"></script>
  </body>
</html>
