services:
  typesafe-proxy:
    image: ghcr.io/ksmarty/typesafe-openai-proxy:latest
    container_name: typesafe-proxy
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Real host path -> the proxy's data directory. config.json lives here, so this
      # is the only thing that has to survive a container update. Point the left side
      # at your own drive, e.g. /mnt/user/appdata/typesafe-proxy or /srv/docker/typesafe-proxy.
      - /opt/typesafe-proxy:/app/data

    # Everything else (decision backend, upstream URL and key, catalog, thresholds) is
    # set once in the dashboard at http://<host>:8080/ and saved into the volume above.
    #
    # To let the container reach a model server that runs on the Docker host itself,
    # uncomment this block and use http://host.docker.internal:<port>/v1 as the
    # upstream URL. Docker Desktop already resolves that name; on Linux this adds it.
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    #
    # If the host directory belongs to another user, uncomment and match your uid:gid:
    # user: "1000:1000"
