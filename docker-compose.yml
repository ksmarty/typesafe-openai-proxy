services:
  typesafe-proxy:
    image: ghcr.io/ksmarty/typesafe-openai-proxy:latest
    container_name: typesafe-proxy
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Real host path on the left -> the proxy's data directory on the right.
      # config.json lives here, so this is the only thing that must survive an
      # image update. Override TYPESAFE_DATA_PATH in .env to point it at your drive.
      - ${TYPESAFE_DATA_PATH:-/opt/typesafe-proxy}:/app/data
    # Lets the container reach a model server running on the Docker host as
    # http://host.docker.internal:<port>/v1. Harmless if unused.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # If the host directory is owned by another user, uncomment and match your uid:gid:
    # user: "1000:1000"
